<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin | Portfólio</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <section id="login" class="caixa login">
    <h1>Painel do portfólio</h1>
    <form id="form-login">
      <label>E-mail<input type="email" id="email" required autocomplete="username"></label>
      <label>Senha<input type="password" id="senha" required autocomplete="current-password"></label>
      <button class="btn" type="submit">Entrar</button>
      <p class="aviso" id="msg-login"></p>
    </form>
  </section>

  <main id="painel" hidden>
    <header>
      <h1>Painel do portfólio</h1>
      <div class="topo-acoes">
        <a class="btn sec" href="../index.html" target="_blank" rel="noopener">Ver site</a>
        <button class="btn sec" id="sair" type="button">Sair</button>
      </div>
    </header>

    <nav id="abas"></nav>

    <section class="caixa">
      <h2 id="titulo-form"></h2>
      <form id="form"></form>
      <p class="aviso" id="msg"></p>
    </section>

    <section id="lista" class="lista"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
